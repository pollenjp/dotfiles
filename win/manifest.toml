# Windows 側へ配るファイル。WSL の nix/scripts/bootstrap-windows-files.sh が
# /mnt/c へコピーする (~/dotfiles/setup --update で走る)。書き方は README.md。
#
#   src   win/ からの相対パス (base = "nix" なら repo 直下の nix/ からの相対パス)
#   dst   Windows 側の置き先。%USERPROFILE% / %APPDATA% / %LOCALAPPDATA% のどれかで始める
#   hint  置き先を書き換えたときに出す文 (任意)
#   base  src の起点。"win" (既定) か "nix" (Linux の home-manager も同じファイルを読むときだけ。home-manager からは
#         nix/ しか見えない)

[[files]]
src = "orca/keybindings.json"
dst = "%USERPROFILE%/.orca/keybindings.json"
hint = "Orca の設定 → キーボードショートカット → 「ディスクから再読み込み」"

[[files]]
src = "powershell/dotfiles.ps1"
dst = "%USERPROFILE%/.config/powershell/dotfiles.ps1"
hint = "開いている PowerShell は . $PROFILE で読み直す ($PROFILE への読み込みの 1 行は、WSL の setup の bootstrap-windows-powershell-profile.sh か、受け持ちを切り替えたホストでは runner の powershell-profile が足す)"

# starship のプロンプトの設定。Linux の home-manager (nix/home/modules/files.nix) も同じファイルを ~/.config/starship.toml に置くので、
# nix/ に置いて base = "nix" で配る。starship は環境変数 STARSHIP_CONFIG が無ければ %USERPROFILE%\.config\starship.toml を読む。
# starship 本体は下の Install-Starship.ps1 (runner の手順 starship) が、$PROFILE の init の 1 行は runner の手順 starship-init が入れる
# (README.md の「starship」)
[[files]]
base = "nix"
src = "files/starship.toml"
dst = "%USERPROFILE%/.config/starship.toml"
hint = "starship はプロンプトのたびに読むので、読み直しは要らない (次のプロンプトから効く。starship 本体と $PROFILE の init の 1 行は、Windows の runner の dotfiles apply が入れる)"

[[files]]
src = "herdr/config.toml"
dst = "%APPDATA%/herdr/config.toml"
hint = "herdr の中なら prefix + shift + r、外からなら PowerShell で hreload (herdr server reload-config) で読み直す"

[[files]]
src = "openssh/Install-OpenSSH.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-OpenSSH.ps1"
hint = "PowerShell で Install-OpenSSH -Check を打つと、固定した版との差が分かる (setup --update でも確かめる)"

[[files]]
src = "herdr/Install-Herdr.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Herdr.ps1"
hint = "PowerShell で Install-Herdr -Check を打つと、固定した版との差が分かる (setup --update でも確かめる)"

[[files]]
src = "ntn/Install-Ntn.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Ntn.ps1"
hint = "PowerShell で Install-Ntn -Check を打つと、固定した版との差が分かる (setup --update が入れて揃えるのは dotfiles.wsl.windowsFiles.ntn.enable = true (既定) のマシン。ntn.exe が動いていれば揃えずに知らせる)"

[[files]]
src = "claude-code/Install-ClaudeCode.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-ClaudeCode.ps1"
hint = "PowerShell で Install-ClaudeCode -Check を打つと、固定した版との差が分かる (setup --update が入れて揃えるのは dotfiles.wsl.windowsFiles.claudeCode.enable = true (既定) のマシン。Windows の Claude Code が動いていれば揃えずに知らせる)"

[[files]]
src = "herdr-app/Install-HerdrApp.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-HerdrApp.ps1"
hint = "PowerShell で Install-HerdrApp -Check を打つと、herdr-app と herdr-core が固定した版・取得元 (手元のフィード) どおりかが分かる (setup --update でも確かめ、揃っていなければ揃える)。外すのは Install-HerdrApp -Uninstall"

# herdr-app と herdr-core の固定した版と sha256。Install-HerdrApp.ps1 が隣のこのファイルを読む。Linux の home-manager
# (nix/pkgs/herdr-core) も同じファイルを読むので、nix/ に置いて base = "nix" で配る
[[files]]
base = "nix"
src = "pkgs/herdr-core/releases.json"
dst = "%USERPROFILE%/.config/powershell/herdr-releases.json"
hint = "Install-HerdrApp.ps1 が読む固定した版。setup --update なら続く bootstrap-windows-herdr-app.sh が、その版とフィードに揃える (手で配ったなら PowerShell で Install-HerdrApp)"

[[files]]
src = "powertoys/keyboard-manager/default.json"
dst = "%LOCALAPPDATA%/Microsoft/PowerToys/Keyboard Manager/default.json"
hint = "setup で流したなら、続く bootstrap-windows-powertoys.sh が Keyboard Manager と自動起動をオンにして (オフなら PowerToys を起動し直す)、読み直させる。bootstrap-windows-files.sh だけを手で流したなら nix/scripts/bootstrap-windows-powertoys.sh も流す (Keyboard Manager がオンで PowerToys が動いていなければ、起動したときに読む。ただし PowerToys の設定画面を一度開いて settings.json ができるまでは読まれず、bootstrap-windows-powertoys.sh が案内する)"

[[files]]
src = "powertoys/keyboard-manager/editorSettings.json"
dst = "%LOCALAPPDATA%/Microsoft/PowerToys/Keyboard Manager/editorSettings.json"
hint = "Keyboard Manager のエディタを開いていたら、閉じて開き直す"

[[files]]
src = "google-japanese-input/Install-GoogleJapaneseInput.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-GoogleJapaneseInput.ps1"
hint = "PowerShell で Install-GoogleJapaneseInput -Check を打つと、固定した版との差が分かる (setup --update でも確かめ、入っていなければ入れる。ずれていても上げず、⚠ で知らせるだけ。入れる・上げるときは UAC の確認が出る)"

[[files]]
src = "powertoys/Install-PowerToys.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-PowerToys.ps1"
hint = "PowerShell で Install-PowerToys -Check を打つと、入っているかが分かる (setup --update でも確かめ、入っていなければ入れる)"

[[files]]
src = "port-forward/Start-PortForward.ps1"
dst = "%USERPROFILE%/.config/powershell/Start-PortForward.ps1"
hint = "PowerShell 7 で pf を打つ (dotfiles.ps1 の pf から呼ぶ。開いている PowerShell は . $PROFILE で読み直す)。共有の port の組は bootstrap-windows-port-forward.sh が置く"

[[files]]
src = "type-clipboard/Install-TypeClipboard.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-TypeClipboard.ps1"
hint = "PowerShell で Install-TypeClipboard -Check を打つと、固定した版との差が分かる (setup --update が入れて確かめるのは dotfiles.wsl.windowsFiles.typeClipboard.enable = true のマシンだけ。ほかのマシンでも Install-TypeClipboard で入れられる)"

[[files]]
src = "op-reason/Install-OpReason.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-OpReason.ps1"
hint = "PowerShell で Install-OpReason -Check を打つと、固定した版との差が分かる (setup --update が入れて揃えるのは、WSL の op の wrapper (op-reason) を入れるマシンだけ。ほかのマシンでも Install-OpReason で入れられる)"

[[files]]
src = "openssh/Install-Sshd.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Sshd.ps1"
hint = "PowerShell で Install-Sshd -Check を打つと、sshd (Tailscale と localhost からだけ、鍵でだけ入れる形) との差が分かる (setup --update が入れるのは dotfiles.wsl.windowsFiles.sshd.enable = true のマシンだけで、入っていないときだけ入れる (UAC の確認が出る)。ずれていれば知らせるだけ)"

[[files]]
src = "tailscale/Install-Tailscale.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Tailscale.ps1"
hint = "PowerShell で Install-Tailscale -Check を打つと、固定した版との差が分かる (setup --update が入れるのは dotfiles.wsl.windowsFiles.tailscale.enable = true のマシンだけで、入っていないときだけ入れる (UAC の確認が出る)。入っていれば上げない。ログインは手でする)"

[[files]]
src = "t3-code/Install-T3Code.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-T3Code.ps1"
hint = "PowerShell で Install-T3Code -Check を打つと、固定した版との差が分かる (runner の dotfiles apply が入れるのはホストの値の [tools] windowsT3Code = true のマシンだけで、入っていないときだけ入れる。入っていれば上げない。サインインとログインは手でする)"

[[files]]
src = "claude-desktop/Install-ClaudeDesktop.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-ClaudeDesktop.ps1"
hint = "PowerShell で Install-ClaudeDesktop -Check を打つと、固定した版との差が分かる (runner の dotfiles apply が入れるのはホストの値の [tools] windowsClaudeDesktop が on のマシン (既定は personal) だけで、入っていないときだけ MSIX を入れる (UAC の確認が 1 回出る)。入っていれば上げない。サインインは手でする)"

[[files]]
src = "ghq/Install-Ghq.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Ghq.ps1"
hint = "PowerShell で Install-Ghq -Check を打つと、固定した版との差が分かる (runner の dotfiles apply が入れて揃える。cdrepo が使う。ghq.exe が動いていれば揃えずに知らせる)"

[[files]]
src = "fzf/Install-Fzf.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Fzf.ps1"
hint = "PowerShell で Install-Fzf -Check を打つと、固定した版との差が分かる (runner の dotfiles apply が winget の portable を入れて揃える。cdrepo が使う。MSI の fzf が入っていれば何も入れずに外し方を出す)"

[[files]]
src = "starship/Install-Starship.ps1"
dst = "%USERPROFILE%/.config/powershell/Install-Starship.ps1"
hint = "PowerShell で Install-Starship -Check を打つと、固定した版との差が分かる (runner の dotfiles apply が winget の portable を入れて揃える。MSI の starship が入っていれば何も入れずに外し方を出す)"
