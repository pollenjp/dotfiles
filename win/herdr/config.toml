# herdr (https://herdr.dev) の Windows 側の設定。dotfiles の win/herdr/config.toml から
# %APPDATA%\herdr\config.toml へ配る (WSL で ~/dotfiles/setup --update。win/README.md)。
#
# [keys]・onboarding・[ui.sidebar] は WSL 側 (nix/files/herdr/config.toml) と同じに保つ。キーや
# sidebar の行ごとの意図はそちらのコメントにある。CI が 2 つを比べ、違えば落ちる
# (nix/scripts/check-herdr-keys.sh)。
#
# WSL 側との違いは 2 つ。[terminal] を書かない (WSL 側の default_shell = "fish" は Windows に
# 無い。空のままなら、Windows の herdr は PATH の pwsh.exe (PowerShell 7) を使い、無ければ
# powershell.exe (5.1) を使う)。[update] で新しい版の通知を止める (下のコメント)。
#
# 反映: 配った後、herdr の中で prefix + shift + r (外からなら PowerShell で hreload =
# herdr server reload-config)。有効なキー名は `herdr --default-config` で出る。
# hr (herdr --remote) で attach している画面は、PowerShell の hreload (Windows の herdr server に
# 届く) では読み直さない。その画面の中で prefix + shift + r を押す。

# 初回のオンボーディングを出さない。未設定だと完了時に herdr がこのファイルへ
# onboarding = false を書き戻し、次の setup --update で衝突として止まる。
onboarding = false

[update]
# 新しい版の通知を出さない。通知から herdr update を打つと、herdr 自身の installer が
# %USERPROFILE%\.herdr に別に入れてユーザーの PATH の先頭に足し、winget で入れた herdr
# (Herdr.Herdr.Preview) が引かれなくなる。版は Install-Herdr.ps1 で固定していて、新しい版は
# Install-Herdr -Check (setup --update でも走る) の ※ の行で分かる (win/README.md の「herdr を入れる」)。
version_check = false

[keys]
# Orca の中で動かすと、ctrl+up / ctrl+down / ctrl+alt+up / ctrl+alt+down は Orca が握る
# (win/orca/keybindings.json のタブと worktree の移動)。Windows Terminal なら herdr に届く。
prefix = "ctrl+k"
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = ["prefix+minus", "prefix+shift+s"]
goto = ["prefix+g", "prefix+double_quote"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
previous_tab = ["prefix+p", "ctrl+up"]
next_tab = ["prefix+n", "ctrl+down"]
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
detach = ["prefix+q", "prefix+d"]
cycle_pane_next = ["prefix+tab", "prefix+o"]
open_notification_target = "prefix+shift+o"
new_worktree = ["prefix+shift+g", "prefix+shift+c"]

[ui.sidebar.spaces]
# 2 行目の先頭に、子の workspace の親 ($parent) を出す。中身は WSL 側と同じ。
# hr (herdr --remote) で WSL や Linux の herdr に attach したときも、sidebar は Windows の herdr が
# このファイルで描く (つないだ先の設定は読まない) ので、こちらにも要る。
rows = [
  ["state_icon", "workspace"],
  [{ token = "$parent", fg = "#a6e3a1" }, "branch", "git_status"],
]
