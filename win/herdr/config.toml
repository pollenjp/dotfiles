# herdr (https://herdr.dev) の Windows 側の設定。dotfiles の win/herdr/config.toml から
# %APPDATA%\herdr\config.toml へ配る (WSL で ~/dotfiles/setup --update。win/README.md)。
#
# [keys] と onboarding は WSL 側 (nix/files/herdr/config.toml) と同じに保つ。キーごとの意図は
# そちらのコメントにある。CI が 2 つを比べ、違えば落ちる (nix/scripts/check-herdr-keys.sh)。
#
# WSL 側との違いは [terminal] を書かないことだけ。WSL 側の default_shell = "fish" は Windows に
# 無い。空のままなら、Windows の herdr は PATH の pwsh.exe (PowerShell 7) を使い、無ければ
# powershell.exe (5.1) を使う。
#
# 反映: 配った後、herdr の中で prefix + shift + r (外からなら PowerShell で hreload =
# herdr server reload-config)。有効なキー名は `herdr --default-config` で出る。

# 初回のオンボーディングを出さない。未設定だと完了時に herdr がこのファイルへ
# onboarding = false を書き戻し、次の setup --update で衝突として止まる。
onboarding = false

[keys]
# Orca の中で動かすと、ctrl+up / ctrl+down / ctrl+alt+up / ctrl+alt+down は Orca が握る
# (win/orca/keybindings.json のタブと worktree の移動)。Windows Terminal なら herdr に届く。
prefix = "ctrl+k"
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = ["prefix+minus", "prefix+shift+s"]
goto = ["prefix+g", "prefix+double_quote"]
rename_tab = ["prefix+shift+t", "prefix+comma"]
previous_tab = ["prefix+p", "ctrl+up"]
next_tab = ["prefix+n", "ctrl+down"]
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"
detach = ["prefix+q", "prefix+d"]
cycle_pane_next = ["prefix+tab", "prefix+o"]
open_notification_target = "prefix+shift+o"
new_worktree = ["prefix+shift+g", "prefix+shift+c"]
