# dotfiles の依存の更新の設定 (repo の拡張 pjp-dotfiles-deps)。依存の更新の skill の script が読む (python3 の tomllib)。
# key の名前・型・取る値は読む側との約束 (ADR 056)。key を足す・変えるときは読む側と揃える。コマンドは argv の配列で書き
# (shell を通さない)、repo の root で打つ。
version = 1

# flake.lock を上げる道具 (argv の頭)。猶予と例外は nix/release-age.nix、update の最後に閉包スキャン (ゲート) が挟まる
flake_lock_age = ["nix/scripts/flake-lock-age.sh"]

# 見ないパス (前方一致。[[checks]] の when には効かない)
# - nix/pkgs/upstream/: 期間付きの例外 (fromUpstream) の中身で、上げずに片付けで扱う。項目が無いあいだはディレクトリも
#   無い (skip と下の [upstream_cleanup] は、次に足す例外のために残す)
# - nix/pkgs/herdr-core/: 版は [[pins]] の windows (releases.json の herdr-app・herdr-core) で見る
# - nix/pkgs/op-reason/: 自作のアプリ (WSL の op の wrapper) の Release。公開からの猶予を置かず、Release を出す流れで
#   win/op-reason/ と同じ PR で上げる (nix/README.md の「op-reason の新しい版を出したとき」)。印 # release-source: も置かない
# - nix/pkgs/t3-code/: T3 Code の CLI。Windows の win/t3-code/Install-T3Code.ps1 と同じ版にし、同じ PR で手で上げる (新しい版の知らせには
#   まだ載せていない。nix/README.md の「T3 Code の版を上げる」)。印 # release-source: も置かない
skip = ["nix/pkgs/upstream/", "nix/pkgs/herdr-core/", "nix/pkgs/op-reason/", "nix/pkgs/t3-code/"]

# release-age.nix の fromUpstream の消し時を見る (dotfiles だけの仕組み。nix/README.md の「猶予の日数と例外」)
[upstream_cleanup]
release_age = "nix/release-age.nix"
pkgs_dir = "nix/pkgs/upstream"

# Windows に固定した版 (OpenSSH・herdr・Google 日本語入力・ntn・Claude Code・Tailscale・ghq・fzf・herdr-app・herdr-core と、bootstrap が入れる
# Git for Windows (git)・GitHub CLI (gh)・Visual Studio Build Tools (vs-buildtools)・rustup)。口の JSON の形は
# nix/scripts/bootstrap-windows-pin-updates.sh の先頭。会話では名前ごとに聞く (問いの中身は SKILL.md の「人が決めること」)
[[pins]]
name = "windows"
list = ["nix/scripts/bootstrap-windows-pin-updates.sh", "--list", "--json"]
candidates = ["nix/scripts/bootstrap-windows-pin-updates.sh", "--candidates", "--json"]
grace_flag = "--grace"
ask = "interactive"

# PR の前に流す確かめ (when のパスが変わったときだけ)
[[checks]]
name = "ntn"
run = ["nix", "build", "--no-link", "-L", "./nix#checks.x86_64-linux.ntn-test"]
when = ["nix/pkgs/ntn/"]

[[checks]]
name = "herdr-core"
run = ["nix", "build", "--no-link", "-L", "./nix#checks.x86_64-linux.herdr-core-test"]
when = ["nix/pkgs/herdr-core/"]

# win/ の ps1 のテスト。CI の lint と同じく、flake が固定している nixpkgs の pwsh で流す (Windows には触らない)。
# 上げた名前のテストだけが流れるよう、名前ごとに分ける
[[checks]]
name = "win-openssh"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/openssh/Install-OpenSSH.Tests.ps1"]
when = ["win/openssh/"]

# sshd (OpenSSH の MSI の Server) の ps1 のテスト。作る sshd_config を sshd -G で読ませるので openssh も借りる
[[checks]]
name = "win-sshd"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "nixpkgs#openssh", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/openssh/Install-Sshd.Tests.ps1"]
when = ["win/openssh/"]

[[checks]]
name = "win-herdr"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/herdr/Install-Herdr.Tests.ps1"]
when = ["win/herdr/"]

[[checks]]
name = "win-google-japanese-input"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/google-japanese-input/Install-GoogleJapaneseInput.Tests.ps1"]
when = ["win/google-japanese-input/"]

[[checks]]
name = "win-ntn"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/ntn/Install-Ntn.Tests.ps1"]
when = ["win/ntn/"]

[[checks]]
name = "win-claude-code"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/claude-code/Install-ClaudeCode.Tests.ps1"]
when = ["win/claude-code/"]

[[checks]]
name = "t3-code"
run = ["nix", "build", "--no-link", "-L", "./nix#checks.x86_64-linux.t3-code-test"]
when = ["nix/pkgs/t3-code/"]

[[checks]]
name = "win-t3-code"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/t3-code/Install-T3Code.Tests.ps1"]
when = ["win/t3-code/"]

[[checks]]
name = "win-claude-desktop"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/claude-desktop/Install-ClaudeDesktop.Tests.ps1"]
when = ["win/claude-desktop/"]

[[checks]]
name = "win-tailscale"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/tailscale/Install-Tailscale.Tests.ps1"]
when = ["win/tailscale/"]

[[checks]]
name = "win-ghq"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/ghq/Install-Ghq.Tests.ps1"]
when = ["win/ghq/"]

[[checks]]
name = "win-fzf"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/fzf/Install-Fzf.Tests.ps1"]
when = ["win/fzf/"]

# bootstrap の 4 つ (git・gh・vs-buildtools・rustup) の版は、どれも win/bootstrap/Install-Bootstrap.ps1 の param の既定値
[[checks]]
name = "win-bootstrap"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/bootstrap/Install-Bootstrap.Tests.ps1"]
when = ["win/bootstrap/"]

# Install-HerdrApp.Tests.ps1 は repo の nix/pkgs/herdr-core/releases.json も読む
[[checks]]
name = "win-herdr-app"
run = ["nix", "shell", "--inputs-from", "./nix", "nixpkgs#powershell", "--command", "pwsh", "-NoProfile", "-NonInteractive", "-File", "win/herdr-app/Install-HerdrApp.Tests.ps1"]
when = ["win/herdr-app/", "nix/pkgs/herdr-core/"]

# skill などの frontmatter (この repo の拡張も)。yq が無ければ script が nix/ の devShell に入り直す
[[checks]]
name = "claude-frontmatter"
run = ["nix/scripts/check-claude-frontmatter.sh"]
when = [".claude/skills/", "nix/files/claude/"]
