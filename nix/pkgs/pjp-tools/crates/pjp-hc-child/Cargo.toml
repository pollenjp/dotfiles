[package]
name = "pjp-hc-child"
version = "0.1.0"
description = "pjp child・pjp mark・pjp pack: hc と herdr-app で別の repo の子を立てる・印を付ける・pack の JSON を作る"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# 道具ごとに bin を分ける (spec §6.2。1 つの道具を直しても、ほかの道具の exe は作り直さない)
[[bin]]
name = "pjp-child"
path = "src/bin/pjp-child.rs"

[[bin]]
name = "pjp-mark"
path = "src/bin/pjp-mark.rs"

[[bin]]
name = "pjp-pack"
path = "src/bin/pjp-pack.rs"

[dependencies]
pjp-core.workspace = true
serde_json.workspace = true
toml.workspace = true

[lints]
workspace = true
