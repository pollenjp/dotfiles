<svg xmlns="http://www.w3.org/2000/svg" width="460" height="240" viewBox="0 0 460 240"
     font-family="'Yu Gothic UI', 'Meiryo UI', Meiryo, 'Segoe UI', sans-serif">
  <title>雛形 compare: 2 つの案 (か前と後) を左右に並べ、下に 1 行ずつの結論を置く。推す案は左に置いて青い枠</title>
  <!-- panel の図の雛形 (pjp-hc-hub の references/panel-figures.md)。案の名前と並びは問いの選択肢と同じにする (推す案が先頭 = 左)。
       前と後を比べるときは左が前・右が後。marks は assets/panel/sections.json の節 compare (流れもユーザーがする所も無ければ空) -->
  <rect width="460" height="240" fill="#1e2228"/>

  <!-- 左: 案 A (推す案。枠を青にし、見出しの右に「推す」) -->
  <text x="16" y="24" font-size="13" font-weight="700" fill="#d7dae0">案 A 名前</text>
  <text x="216" y="24" text-anchor="end" font-size="11" font-weight="700" fill="#61afef">推す</text>
  <text x="16" y="42" font-size="11" fill="#9aa2ae">どう動くか (1 行目)</text>
  <text x="16" y="56" font-size="11" fill="#9aa2ae">2 行目</text>
  <rect x="8" y="66" width="214" height="116" rx="8" fill="#263445" stroke="#61afef" stroke-width="2"/>
  <text x="18" y="84" font-size="11" fill="#61afef">入れ物 (アプリ・窓)</text>
  <rect x="18" y="94" width="96" height="74" rx="6" fill="#26352a" stroke="#98c379" stroke-width="1.5"/>
  <text x="66" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#d7dae0">部品</text>
  <text x="66" y="146" text-anchor="middle" font-size="11" fill="#98c379">良い状態</text>
  <rect x="122" y="94" width="90" height="74" rx="6" fill="#26352a" stroke="#98c379" stroke-width="1.5"/>
  <text x="167" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#d7dae0">部品</text>
  <text x="167" y="146" text-anchor="middle" font-size="11" fill="#98c379">良い状態</text>
  <text x="16" y="206" font-size="12" fill="#98c379">○ 良い点</text>
  <text x="16" y="226" font-size="11" fill="#9aa2ae">補足 (数字・出どころ)</text>

  <line x1="230" y1="14" x2="230" y2="226" stroke="#3e4451" stroke-width="1"/>

  <!-- 右: 案 B -->
  <text x="246" y="24" font-size="13" font-weight="700" fill="#d7dae0">案 B 名前</text>
  <text x="246" y="42" font-size="11" fill="#9aa2ae">どう動くか (1 行目)</text>
  <text x="246" y="56" font-size="11" fill="#9aa2ae">2 行目</text>
  <rect x="238" y="66" width="214" height="116" rx="8" fill="#23272e" stroke="#5c6370"/>
  <text x="248" y="84" font-size="11" fill="#9aa2ae">入れ物 (アプリ・窓)</text>
  <rect x="248" y="94" width="96" height="74" rx="6" fill="#26352a" stroke="#98c379" stroke-width="1.5"/>
  <text x="296" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#d7dae0">部品</text>
  <text x="296" y="146" text-anchor="middle" font-size="11" fill="#98c379">良い状態</text>
  <rect x="352" y="94" width="90" height="74" rx="6" fill="#2c323c" stroke="#5c6370"/>
  <text x="397" y="124" text-anchor="middle" font-size="12" font-weight="700" fill="#d7dae0">部品</text>
  <text x="397" y="146" text-anchor="middle" font-size="11" fill="#e5c07b">気になる状態</text>
  <text x="246" y="206" font-size="12" fill="#e5c07b">△ 気をつける点</text>
  <text x="246" y="226" font-size="11" fill="#9aa2ae">補足 (数字・出どころ)</text>
</svg>
