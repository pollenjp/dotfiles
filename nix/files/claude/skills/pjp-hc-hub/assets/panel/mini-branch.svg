<svg xmlns="http://www.w3.org/2000/svg" width="200" height="80" viewBox="0 0 200 80"
     font-family="'Yu Gothic UI', 'Meiryo UI', Meiryo, 'Segoe UI', sans-serif">
  <title>雛形 mini-branch: 1 つ (左・青) が 2 つ (右) に分かれる</title>
  <!-- panel のミニ絵の雛形 (pjp-hc-hub の references/panel-figures.md の「ミニ絵」)。字だけを替えて使う。
       箱の字は、左 (11 px・太字) が全角 5 字まで、右 (11 px・太字) が全角 7 字まで (半角は 2 字で全角 1 字)。
       結果が分かれるなら、右の箱を緑 (思ったとおり) と赤 (違った) に替える。動き (marks) は付けない -->
  <rect width="200" height="80" fill="#1e2228"/>

  <!-- 分かれる線と矢印 -->
  <line x1="68" y1="40" x2="86" y2="40" stroke="#5c6370" stroke-width="2"/>
  <line x1="86" y1="21" x2="86" y2="59" stroke="#5c6370" stroke-width="2"/>
  <line x1="86" y1="21" x2="105" y2="21" stroke="#5c6370" stroke-width="2"/>
  <polygon points="105,16 112,21 105,26" fill="#5c6370"/>
  <line x1="86" y1="59" x2="105" y2="59" stroke="#5c6370" stroke-width="2"/>
  <polygon points="105,54 112,59 105,64" fill="#5c6370"/>

  <!-- 分かれる元 (青) -->
  <rect x="4" y="24" width="64" height="32" rx="6" fill="#263445" stroke="#61afef" stroke-width="2"/>
  <text x="36" y="44" text-anchor="middle" font-size="11" font-weight="700" fill="#61afef">元の名前</text>

  <!-- 分かれた先 (灰) -->
  <rect x="112" y="6" width="84" height="30" rx="6" fill="#2c323c" stroke="#5c6370"/>
  <text x="154" y="25" text-anchor="middle" font-size="11" font-weight="700" fill="#d7dae0">先 1 の名前</text>
  <rect x="112" y="44" width="84" height="30" rx="6" fill="#2c323c" stroke="#5c6370"/>
  <text x="154" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#d7dae0">先 2 の名前</text>
</svg>
