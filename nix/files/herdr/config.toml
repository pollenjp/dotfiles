# herdr (https://herdr.dev) の設定。
#
# キーバインドは tmux / zellij と指の動きが揃うようにしてある。
#   zellij 側の意図 -> nix/files/zellij/config.kdl の "Customize" コメント
#   tmux 側の意図   -> nix/files/tmux/home.tmux.conf の Keybind 節
#
# prefix (herdr) と tmux mode の入口 (zellij) は両方 ctrl+k で揃えてある。
# もとは両方 ctrl+j だったが、中継越しに届かないので移した ([keys] 冒頭)。
#
# 変更を反映するには home-manager switch のあと、herdr の中で prefix + shift + r
# (または `herdr server reload-config`)。
#
# 有効なキー名・既定値は `herdr --default-config` で全部出せる。
# 起動中なら prefix + ? で今効いているバインドが一覧できる。

# 初回起動時のオンボーディングを出さない。
#
# 未設定 (既定 true) だと、オンボーディング完了時に herdr が
# `onboarding = false` を**この設定ファイルへ書き戻す**。Nix 管理下のパスは
# store への symlink で read-only なので書き込みに失敗し、次の起動でも
# またオンボーディングが出る。最初から false を書いておいて書き込ませない。
onboarding = false

[terminal]
# 新しい pane のシェル。未設定だと $SHELL -> /bin/sh の順で決まるが、
# ログインシェルは fish ではないので明示する
# (zellij では `z` 関数が SHELL を差し替えて同じことをしている)。
#
# ここは PATH から引かれる。fish は programs.fish が home profile へ入れる
# ので、対話的に起動した herdr なら必ず解決できる。store の絶対パスを
# 書けば PATH に依存しなくなるが、それには設定ファイルを Nix 側で生成する
# 必要があり、files/ を「そのまま置くだけ」に保つ方針から外れるので採らない。
default_shell = "fish"

# shell_mode は既定の "auto" (macOS だけログインシェル) のまま。
# fish は login/非 login どちらでも ~/.config/fish/config.fish を読むので
# bash と違って差が出ない。

[keys]
# prefix は ctrl+k (herdr の既定は ctrl+b)。
#
# もともと ctrl+j にしていた (zellij の tmux mode 入口と指を揃えるため) が、
# **中継を挟むと herdr まで届かない**ので移した。
#
# ctrl+j は端末上では LF (0x0a) で、enter (CR, 0x0d) と並んで「行末」の意味を
# 背負っているバイトなので、行端末の正規化をする中継はここを潰す。実際に
# 次の 2 経路で届かなかった:
#   powershell -> wsl -> ssh -> linux
#   aws ssm start-session
# powershell から ssh.exe で直結したときだけ通る。ssh.exe は INPUT_RECORD の
# UnicodeChar を自前で読むので 0x0a が生き残る、というのが理由と思われる
# (未確定。WSL 側で showkey -a を見れば確定する)。
#
# 同じ理由で避けるべきキー: ctrl+m (CR), ctrl+i (Tab), ctrl+[ (Esc),
# ctrl+h (BS), ctrl+s / ctrl+q (XON/XOFF)。
#
# 注意: **tmux 側の prefix も ctrl+k なので衝突する** (home.tmux.conf の
# `set-option -g prefix C-k`)。herdr の中で tmux を動かすと tmux の prefix は
# herdr に食われるので、下へ届かせるには prefix を 2 回 (prefix+ctrl+k) 押して
# リテラルを流す。tmux in tmux と同じ作法で、1 打鍵増えるのを承知の上で
# 「中継越しに届くこと」を優先した判断。
prefix = "ctrl+k"

##############################################################################
# tmux 由来のキーに寄せる (zellij の tmux mode へ入れたのと同じ変更)
##############################################################################

# 分割。tmux 側の `bind | split-window -h` / `bind S split-window -v` に合わせる。
#
# tmux と herdr で horizontal / vertical の語の向きが逆なので注意:
#   tmux -h (左右に並べる) = herdr split_vertical
#   tmux -v (上下に積む)   = herdr split_horizontal
#
# herdr 既定の prefix+v / prefix+minus も残してあるので、どちらでも切れる。
split_vertical = ["prefix+v", "prefix+|"]
split_horizontal = ["prefix+minus", "prefix+shift+s"]

# tmux 側で `bind '"' choose-tree -w` に振っているので `"` は一覧を開く。
# zellij でも tmux mode の `"` を「分割」から「tab 選択」へ振り替えている。
# herdr で対応するのは goto (session / workspace / tab / pane のナビゲータ)。
# `"` は TOML の引用符と紛らわしいので別名の double_quote で書く。
goto = ["prefix+g", "prefix+double_quote"]

# tmux の prefix+, (rename-window) 相当。既定の prefix+shift+t も残す。
rename_tab = ["prefix+shift+t", "prefix+comma"]

# prefix を挟まずに tab を移動する。
#
# 本当は ctrl+pgup / ctrl+pgdown にしたかったが、**herdr は PageUp /
# PageDown をキー名として持っていない** (0.7.5 / 0.8.0 / master いずれの
# parse_key_combo にも無い。pgup / pageup / page_up などどう綴っても
# `invalid keybinding` で無効化される)。バージョンを上げても解決しない。
#
# そこで修飾キーと向きをそのままに ctrl+up / ctrl+down へ寄せる。
# ctrl+left / ctrl+right は shell の単語移動を潰すので避けた。
#
# 注意: これらは prefix 無しの直接バインドなので herdr が握り、pane の中
# (tmux や vim) には届かなくなる。ctrl+up / ctrl+down は shell でも vim でも
# 既定では使われていないので実害は無いはず。
previous_tab = ["prefix+p", "ctrl+up"]
next_tab = ["prefix+n", "ctrl+down"]

# 同じく prefix を挟まずに workspace を移動する。
# alt を足すと 1 段上の階層 (tab -> workspace) になる、という対応にしてある。
#
# previous_workspace / next_workspace は herdr の既定では**未割り当て**なので、
# ここで初めてキーが付く (既定バインドを潰す心配は無い)。
previous_workspace = "ctrl+alt+up"
next_workspace = "ctrl+alt+down"

# tmux の prefix+d (detach) 相当。
#
# zellij の Ctrl+q (Quit) に当たるものは herdr のキーバインドには無い。
# session を常駐させ続けるのが herdr の前提なので、離脱は detach が正道
# (落とすなら `herdr kill`)。既定の prefix+q はそのまま残してある。
detach = ["prefix+q", "prefix+d"]

# tmux の prefix+o (次の pane へ) 相当。
#
# 既定では prefix+o が open_notification_target なので、そちらを shift+o へ
# 退避させてから奪う。退避先を書かずに奪うと、通知が来た pane へ飛ぶ操作が
# 黙って消える (herdr 側は「後勝ちで default を無効化」して警告も出さない)。
cycle_pane_next = ["prefix+tab", "prefix+o"]
open_notification_target = "prefix+shift+o"

##############################################################################
# herdr 固有 (tmux / zellij に対応物が無い)
##############################################################################

# git worktree を切って workspace として開く。
#
# 既定は prefix+shift+g だが、
#   - 素の prefix+g は goto (ナビゲータ) に張ってあるので指が同じで意味が違う
#   - 「新しい作業場所を作る」操作は prefix+c (new_tab) の親戚として覚えたい
# ので prefix+shift+c を足す。既定の prefix+shift+g もそのまま残す。
#
# prefix+shift+c は herdr 既定では**未割り当て** (`herdr --default-config` で確認)
# なので、上の cycle_pane_next のように退避先を用意する必要は無い。
#
# shift 付きは素のキーと別物として扱われる (既定が prefix+x / prefix+shift+x の
# ように両方持っている) ので、prefix+c の new_tab とは衝突しない。
#
# 切った worktree の置き場は [worktrees] directory の既定 (~/.herdr/worktrees)
# のまま。変えるならこのファイルに [worktrees] 節を足す。
new_worktree = ["prefix+shift+g", "prefix+shift+c"]

##############################################################################
# 触っていないもの / 書き足すときの注意
##############################################################################
#
# `herdr config check` は**キー名の綴りしか見ない**。存在しないキー
# (prefix+shift+pgup など) は `invalid keybinding` で落としてくれるが、
# 既定バインドの奪い合いは検出しない (new_worktree に prefix+c を張って
# new_tab を潰しても `config: ok` と言う)。奪っていないことは
# `herdr --default-config | grep <キー>` で自分で確かめる。
#
# ctrl+h は **prefix 無しの直接バインドに使わないこと**。herdr の中で tmux を
# 動かしたときに pane 移動が herdr に食われる。zellij は既定で食っていたので
# `unbind "Ctrl h"` が要ったが、herdr は既定で直接バインドをほとんど持たない
# ので、こちらから足さない限り何もしなくてよい。
#
# ctrl+k は prefix そのものに使っている ([keys] 冒頭を参照)。tmux の prefix と
# 衝突しているのは承知の上での判断。
#
# 既定のままで tmux と同じもの (だから上に書いていない):
#   prefix+c         新しい tab
#   prefix+n / p     次 / 前の tab
#   prefix+1..9      番号で tab 移動
#   prefix+x         pane を閉じる
#   prefix+z         pane の zoom
#   prefix+[         copy mode
#   prefix+h/j/k/l   pane 移動
#   prefix+ctrl+k    prefix を 2 回押すとリテラルの ctrl+k が下へ流れる
#                    (中の tmux へ prefix を届かせる唯一の手段。要動作確認)
#
# herdr に対応物が無くて落としたもの:
#   zellij Ctrl+q (Quit)      常駐前提なので Quit が無い。detach で代用
#   zellij Ctrl+b (tmux mode) prefix は 1 つしか持てない。ctrl+k に寄せた
#   zellij Ctrl+t (tab mode)  herdr にモードは無く prefix+ の直打ちで完結する
#   zellij space  (swap layout) herdr に layout の概念が無い
