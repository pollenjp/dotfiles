name: win-runner

# Windows 側の runner (win/runner/。Rust の dotfiles-win) を、Linux と Windows の両方で確かめる (dotfiles-private の
# docs/adr/060_win_runner_core_*)。
#
# - Linux: Nix も入れて、runner の manifest の読み方を WSL が使う nix/lib/windows-files.nix (nix-instantiate) と突き合わせる
#   (tests/manifest_parity.rs。DOTFILES_WIN_NIX_PARITY=1 で、nix-instantiate が無ければ飛ばさずに落ちる)。google-ime は pjp-google-ime を
#   試験の中で nix build (repo の flake) で作って突き合わせる (同じく、作れなければ落ちる)。fmt もここだけ
# - Windows: MSVC (windows-latest の既定の host。bootstrap が入れるのと同じ) で、Windows のパスと外のコマンド (PowerShell・hostname・git)
#   の口を確かめる
#
# runner は win/ のファイル (manifest.toml とその src・Install-*.ps1・groups.json)・manifest の base = "nix" の src (nix/ の下にあるので
# 1 つずつ並べる。nix/files/starship.toml は Windows の starship で使えるかも試験が見る。nix/pkgs/herdr-core/releases.json は下の版の
# 知らせと共通)・nix/lib/windows-files.nix・WSL の手順の一覧
# (nix/scripts/bootstrap-windows-*.sh。手順の id を突き合わせる)・hc の skill の頭 (nix/pkgs/herdr-core/claude-skill-head.md。Linux と
# 共有)・Claude の settings.json の env と claude-notion.json の元 (nix/home/modules/claude.nix・nix/lib/git-via-gh.nix と、突き合わせに使う
# sandbox のホストの nix/hosts/default.nix。Linux の CI で突き合わせる)・Windows の Claude Code に配る設定の元 (nix/files/claude/ の CLAUDE.md・
# skill・footer-links.json と、Rust に写した hook・status line の bash の版。Linux の CI で bash の版と突き合わせる。hook の登録と skillOverrides
# は nix/scripts/bootstrap-claude-hook.sh・bootstrap-claude-skill-overrides.sh と突き合わせる)・マシンローカルの環境変数のファイルの欄
# (runner の local-env。Linux の CI で nix/scripts/bootstrap-local-env.sh と突き合わせる)・Notion の API キーの宣言と知らせ (runner の notion-tokens。
# Linux の CI で nix/lib/notion-tokens.nix の stateText・assertions と nix/scripts/bootstrap-notion-tokens.sh と突き合わせる)・claude の token の置き場の宣言
# (runner の claude-tokens。Linux の CI で nix/lib/claude-tokens.nix の stateText・assertions と突き合わせる)・git の設定の正本 (nix/home/modules/git.toml。Linux の CI で
# git.nix と direnv.nix が作る home-manager の programs.git と突き合わせる)・c の中身 (nix/home/modules/fish.nix・bash.nix。herdr-app の
# prefix の mod が Claude Code を起こす argv と突き合わせる)・Google 日本語入力の pjp-google-ime (nix/pkgs/pjp-google-ime/ の .proto の写しと
# Python の版。Linux の CI で repo の flake から nix で作って突き合わせる。nixpkgs の protobuf の版で振る舞いが変わりうるので nix/flake.lock も) と
# WSL の試験 (nix/tests/bootstrap-windows-google-ime.test.sh。偽の tasklist.exe・taskkill.exe を抜き出す)・固定した版より新しい版の知らせの口
# (nix/scripts/check-winget-version.sh・check-herdr-app-version.sh。pin-updates を Linux の CI で突き合わせ、本物の releases.json・見送りの一覧でも流す)・
# claude-selector の crate (nix/pkgs/claude-selector。runner の手順 claude-selector が Windows で作る。Windows の既定のアカウントと使えない名前を
# 突き合わせる。crate 自身の clippy と test も Windows でここが流す。Linux は nix の checks の claude-selector-test・claude-selector-lint) を
# 読むので、それらを変えた PR でも流す。
on:
  push:
    branches: [main]
    paths:
      - "win/**"
      - "nix/files/starship.toml"
      - "nix/lib/windows-files.nix"
      - "nix/lib/git-via-gh.nix"
      - "nix/home/modules/claude.nix"
      - "nix/home/modules/git.toml"
      - "nix/home/modules/git.nix"
      - "nix/home/modules/direnv.nix"
      - "nix/home/modules/fish.nix"
      - "nix/home/modules/bash.nix"
      - "nix/hosts/default.nix"
      - "nix/pkgs/herdr-core/claude-skill-head.md"
      - "nix/scripts/bootstrap-windows-*.sh"
      - "nix/files/claude/**"
      - "nix/scripts/bootstrap-claude-hook.sh"
      - "nix/scripts/bootstrap-claude-skill-overrides.sh"
      - "nix/scripts/bootstrap-local-env.sh"
      - "nix/lib/notion-tokens.nix"
      - "nix/lib/claude-tokens.nix"
      - "nix/scripts/bootstrap-notion-tokens.sh"
      - "nix/pkgs/pjp-google-ime/**"
      - "nix/tests/bootstrap-windows-google-ime.test.sh"
      - "nix/scripts/check-winget-version.sh"
      - "nix/scripts/check-herdr-app-version.sh"
      - "nix/pkgs/herdr-core/releases.json"
      - "nix/pkgs/herdr-core/skipped-versions.txt"
      - "nix/pkgs/claude-selector/**"
      - "nix/flake.lock"
      - ".github/workflows/win-runner.yml"
  pull_request:
    paths:
      - "win/**"
      - "nix/files/starship.toml"
      - "nix/lib/windows-files.nix"
      - "nix/lib/git-via-gh.nix"
      - "nix/home/modules/claude.nix"
      - "nix/home/modules/git.toml"
      - "nix/home/modules/git.nix"
      - "nix/home/modules/direnv.nix"
      - "nix/home/modules/fish.nix"
      - "nix/home/modules/bash.nix"
      - "nix/hosts/default.nix"
      - "nix/pkgs/herdr-core/claude-skill-head.md"
      - "nix/scripts/bootstrap-windows-*.sh"
      - "nix/files/claude/**"
      - "nix/scripts/bootstrap-claude-hook.sh"
      - "nix/scripts/bootstrap-claude-skill-overrides.sh"
      - "nix/scripts/bootstrap-local-env.sh"
      - "nix/lib/notion-tokens.nix"
      - "nix/lib/claude-tokens.nix"
      - "nix/scripts/bootstrap-notion-tokens.sh"
      - "nix/pkgs/pjp-google-ime/**"
      - "nix/tests/bootstrap-windows-google-ime.test.sh"
      - "nix/scripts/check-winget-version.sh"
      - "nix/scripts/check-herdr-app-version.sh"
      - "nix/pkgs/herdr-core/releases.json"
      - "nix/pkgs/herdr-core/skipped-versions.txt"
      - "nix/pkgs/claude-selector/**"
      - "nix/flake.lock"
      - ".github/workflows/win-runner.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            os: ubuntu-latest
          # GNU の host は使わない (bootstrap が入れるのは MSVC。dotfiles-private の docs/adr/058_win_runner_bootstrap_* §2 D)
          - name: windows (msvc)
            os: windows-latest
    runs-on: ${{ matrix.os }}
    # 固まったジョブが分を食いつぶさないようにする (既定は 360 分)
    timeout-minutes: 30
    defaults:
      run:
        working-directory: win/runner
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # manifest の読み方を nix-instantiate と突き合わせるため (Linux だけ)
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        if: runner.os == 'Linux'

      # 版と components (rustfmt・clippy) は rust-toolchain.toml から rustup が入れる
      - name: toolchain (rust-toolchain.toml)
        run: rustup toolchain install

      - name: fmt
        if: runner.os == 'Linux'
        run: cargo fmt --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      # 1 つの test の束が落ちても、残りの束も流す (Windows の落ち方は手元で流せないので、1 回の run で全部を見る)。Linux では、Rust に写した
      # Claude Code の hook・status line・skillOverrides と WSL の手順を bash の版 (bash と jq。ubuntu の image に入っている) と突き合わせる
      # (飛ばさずに落ちる)
      - name: test
        env:
          DOTFILES_WIN_NIX_PARITY: ${{ runner.os == 'Linux' && '1' || '0' }}
          DOTFILES_WIN_BASH_PARITY: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: cargo test --locked --no-fail-fast

      # claude-selector (nix/pkgs/claude-selector) を、runner の手順 claude-selector が作るのと同じ toolchain (この dir の rust-toolchain.toml)
      # で Windows でも確かめる (cfg(windows) の起こし方と Ctrl+C の handler・PowerShell の引用・.exe の探し方)。Linux は nix の checks
      - name: claude-selector (clippy)
        # runner の段が落ちても流す (1 回の run で selector の落ち方も見る)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo clippy --locked --all-targets --manifest-path ../../nix/pkgs/claude-selector/Cargo.toml -- -D warnings

      - name: claude-selector (test)
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: cargo test --locked --no-fail-fast --manifest-path ../../nix/pkgs/claude-selector/Cargo.toml
