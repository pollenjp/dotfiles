name: nix

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "nix/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
    inputs:
      # lock-age ジョブの下限日数を一時的に下げるための逃げ道。
      # 緊急で先端の CVE 修正を入れた commit を通したいときに 0 で再実行する。
      # 空なら script の既定 (7 日) を使う。
      min_release_age_days:
        description: "flake.lock の pin の下限日数 (空なら既定の 7)"
        required: false
        type: string
  # closure-scan の定期実行 (main で走る)。advisory (OSV / GHSA) は pin より後から
  # 出るので、commit の無い期間も現在の pin が指す閉包を照合し続ける。
  # 他のジョブは schedule では回さない (pin は動かないので結果が変わらない)。
  schedule:
    - cron: "0 21 * * *" # JST 朝 6:00

concurrency:
  # event_name を含めるのは schedule と push が同じ ref (main) を共有するため。
  # 無いと定期実行と push の実行が互いを取り消す。
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 各ランナーの system 向けに実際にビルドする。
  #
  # NOTE: `nix flake check` は homeConfigurations を評価しない (well-known output では
  #       ないため)。flake.nix が activationPackage を checks へ再エクスポートしている
  #       ので、それを通して home-manager 設定が検証される。
  check:
    name: flake check (${{ matrix.system }})
    if: github.event_name != 'schedule'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # 全 system の評価のみ。ランナーが存在しない aarch64-linux も含めて
      # オプション名の誤りやプラットフォーム分岐の壊れを検出できる。
      # ubuntu 側だけで十分なので macOS では実行しない。
      - name: 全 system を評価 (ビルドなし)
        if: matrix.os == 'ubuntu-latest'
        run: nix flake check --all-systems --no-build ./nix

      # --no-eval-cache は必須。外すと x86_64-linux だけが
      # `error: path '/nix/store/...-hm_screenrc' is not valid` で落ちる
      # (落ちる check もパスも実行ごとに変わる)。
      #
      # 直前の `--no-build` は eval だけして derivation を実体化しないため、
      # その評価結果を eval cache 経由でこのステップが再利用すると、まだ
      # store に無いソースを参照する .drv を build しようとする。
      # --no-build を実行しない macOS 側で再現しないこととも整合する。
      #
      # cache を捨てて評価し直させるだけなので検証内容は変わらない。
      # 外すときは x86_64-linux が通ることを必ず確認すること。
      - name: このランナーの system をビルド
        run: nix flake check --no-eval-cache ./nix

      # 設定が壊れていないことに加えて、activate まで通ることを確認する。
      # sandbox は homeDirectory を /tmp/hm-sandbox に固定しているので
      # ランナーの実 HOME を汚さない。
      #
      # XDG_RUNTIME_DIR を systemd のソケットが無い場所へ向けるのは、
      # systemd.user.services を持つ構成のため。activate は
      # `systemctl --user is-system-running` で user systemd の生死を見て、
      # 届かなければ "Skipping reload." で systemd の面倒を見ない。
      #
      # これを外すと、偽の HOME に置いた unit を**ランナーの実 systemd**へ
      # 起動させにいって NoSuchUnit で落ちる (unit は /tmp/hm-sandbox の下に
      # 置かれるが、実 systemd は実 HOME しか見ないため)。
      # ここで確認したいのは「activate が最後まで通ること」であって
      # 「ランナーで daemon が起きること」ではない。
      - name: sandbox へ activate して冪等性を確認
        if: matrix.os == 'ubuntu-latest'
        run: |
          nix build './nix#homeConfigurations.sandbox.activationPackage' -o /tmp/hm
          mkdir -p /tmp/hm-sandbox/.local/state/nix/profiles /tmp/hm-sandbox/run
          export XDG_RUNTIME_DIR=/tmp/hm-sandbox/run
          HOME=/tmp/hm-sandbox USER=user /tmp/hm/activate
          HOME=/tmp/hm-sandbox USER=user /tmp/hm/activate

      - name: warnings が空であることを確認
        if: matrix.os == 'ubuntu-latest'
        run: |
          warnings=$(nix eval --json \
            './nix#homeConfigurations.sandbox.config.warnings')
          echo "warnings: ${warnings}"
          test "${warnings}" = "[]"

  # flake.lock が「先端」へ飛んでいないことを確認する。
  #
  # flake.nix は nixpkgs-unstable を追ったままで、遅延は flake-lock-age.sh が
  # lock に書く pin でしか表現されていない。つまり素で `nix flake update` を
  # 叩くと遅延は黙って外れる。それに気付くための番人がこのジョブ。
  #
  # 対象はリポジトリ内の flake **すべて**。本体だけ見ていると、skill 側の
  # flake が先端に張り付いたままになる。flake を足したらここへも足すこと。
  #
  # 判定に使う lastModified は commit 時刻なので、チャンネル公開時刻より
  # 1〜2 日古い側に出る (= 判定は少し緩い)。先端への事故を捕まえるには十分。
  lock-age:
    name: flake.lock の遅延ポリシー
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # script は flake.lock の JSON を nix に読ませる (jq に依存しない)。
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: pin が下限日数を満たすか
        env:
          # workflow_dispatch 以外では空になり、script 側の既定 (7) が効く。
          FLAKE_MIN_RELEASE_AGE_DAYS: ${{ inputs.min_release_age_days }}
        run: |
          ./nix/scripts/flake-lock-age.sh check \
            ./nix \
            ./nix/files/claude/skills/pjp-drawio \
            ./nix/files/claude/skills/pjp-plantuml

  # devShell に入っている nixfmt / shfmt / shellcheck で整形と静的解析を確認する。
  lint:
    name: lint
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: nixfmt --check
        run: |
          nix develop ./nix --command bash -c '
            find nix -name "*.nix" -print0 | xargs -0 nixfmt --check
          '

      # nix/ 配下の *.sh をすべて見る。scripts/ だけでなく、Nix が配置する
      # files/bin/ files/claude/hooks/ files/claude/skills/*/scripts/ も
      # 実行されるものなので同じ静的解析にかける。nixfmt と同じく find で
      # 拾うので、置き場所が増えてもここを直さなくてよい。
      - name: shfmt / shellcheck
        run: |
          nix develop ./nix --command bash -c '
            mapfile -t files < <(find nix -type f -name "*.sh" | sort)
            printf "checking %s\n" "${files[@]}"
            shfmt -d "${files[@]}"
            shellcheck "${files[@]}"
          '

  # 閉包を SBOM 化して OSV / GHSA / NVD と照合する (ADR 006)。
  #
  # 遅延 pin (lock-age) は「発覚済みの侵害バージョンを下限日数のあいだ固定し
  # 続ける」リスクを新しく作る。発覚済みのものは advisory に載るので、pin の
  # 結果として実際に入る閉包をスキャンして照合するのがこのジョブ。
  #
  # whitelist (nix/vulnxscan-whitelist.csv) は増分検知の基準線で、whitelist に
  # 無い findings があると落ちる。対応は 2 択 (pin を動かして直るか見る /
  # 理由を書いて whitelist へ足す)。手順は nix/README.md。
  #
  # schedule でも回すのは、advisory が pin より後から出るため。commit の無い
  # 期間も毎日、現在の pin が指す閉包を照合し続ける。
  closure-scan:
    name: 閉包の脆弱性スキャン
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: 閉包を SBOM 化してスキャン
        run: ./nix/scripts/closure-scan.sh scan --out-dir ./closure-scan-out

      # findings で落ちた実行でも、何が出たかは summary と artifact で読めるようにする。
      - name: レポートを summary へ
        if: always()
        run: |
          {
            echo "## closure-scan (whitelist 適用後の findings)"
            echo '```'
            cat ./closure-scan-out/report.txt 2>/dev/null \
              || echo "(report.txt なし: スキャンより前の段階で失敗)"
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"

      # closure symlink は上げない (閉包そのもの 1.3 GiB を辿ってしまう)。
      - name: SBOM と findings を artifact へ
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: closure-scan
          path: |
            closure-scan-out/sbom.csv
            closure-scan-out/sbom.cdx.json
            closure-scan-out/sbom.spdx.json
            closure-scan-out/vulns.csv
            closure-scan-out/report.txt
            closure-scan-out/new-findings.txt
          if-no-files-found: ignore

  # pin と先端の間で、自分の閉包に入るパッケージが動いていないかのレポート (ADR 006)。
  #
  # 侵害の発覚後、advisory より先に nixpkgs 側の対応 (bump / revert /
  # knownVulnerabilities) が入ることがよくある。pin を更新する PR で「動いた
  # パッケージのうち見覚えの無いものだけコミットログを見る」ための材料を出す。
  # 版が動くこと自体は日常なので、差分の有無では落とさない。
  head-diff:
    name: pin と先端の閉包差分
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # base との比較で nix/flake.lock が動いたかを見るため履歴ごと取る。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: nix/flake.lock が動いた PR か
        id: lock
        run: |
          if git diff --quiet "origin/${GITHUB_BASE_REF}...HEAD" -- nix/flake.lock; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
            echo "nix/flake.lock は動いていないので比較しません。"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
          fi

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22
        if: steps.lock.outputs.changed == 'true'

      - name: pin と先端で閉包を組んで比較
        if: steps.lock.outputs.changed == 'true'
        run: ./nix/scripts/closure-head-diff.sh --out-dir ./head-diff-out ./nix

      - name: レポートを summary へ
        if: steps.lock.outputs.changed == 'true'
        run: |
          {
            echo "## pin と先端の閉包差分"
            echo '```'
            cat ./head-diff-out/head-diff.txt
            echo '```'
            echo "読み方: 見覚えの無い動きだけ nixpkgs のコミットログを確認する (ADR 006)。"
          } >>"$GITHUB_STEP_SUMMARY"
