name: nix

on:
  push:
    branches: [main]
    paths:
      - "nix/**"
      - ".github/workflows/nix.yml"
  pull_request:
    paths:
      - "nix/**"
      - ".github/workflows/nix.yml"
  workflow_dispatch:
    inputs:
      # lock-age ジョブの下限日数を一時的に下げるための逃げ道。
      # 緊急で先端の CVE 修正を入れた commit を通したいときに 0 で再実行する。
      # 空なら script の既定 (7 日) を使う。
      min_release_age_days:
        description: "flake.lock の pin の下限日数 (空なら既定の 7)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 各ランナーの system 向けに実際にビルドする。
  #
  # NOTE: `nix flake check` は homeConfigurations を評価しない (well-known output では
  #       ないため)。flake.nix が activationPackage を checks へ再エクスポートしている
  #       ので、それを通して home-manager 設定が検証される。
  check:
    name: flake check (${{ matrix.system }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            system: x86_64-linux
          - os: macos-latest
            system: aarch64-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      # 全 system の評価のみ。ランナーが存在しない aarch64-linux も含めて
      # オプション名の誤りやプラットフォーム分岐の壊れを検出できる。
      # ubuntu 側だけで十分なので macOS では実行しない。
      - name: 全 system を評価 (ビルドなし)
        if: matrix.os == 'ubuntu-latest'
        run: nix flake check --all-systems --no-build ./nix

      # --no-eval-cache は必須。外すと x86_64-linux だけが
      # `error: path '/nix/store/...-hm_screenrc' is not valid` で落ちる
      # (落ちる check もパスも実行ごとに変わる)。
      #
      # 直前の `--no-build` は eval だけして derivation を実体化しないため、
      # その評価結果を eval cache 経由でこのステップが再利用すると、まだ
      # store に無いソースを参照する .drv を build しようとする。
      # --no-build を実行しない macOS 側で再現しないこととも整合する。
      #
      # cache を捨てて評価し直させるだけなので検証内容は変わらない。
      # 外すときは x86_64-linux が通ることを必ず確認すること。
      - name: このランナーの system をビルド
        run: nix flake check --no-eval-cache ./nix

      # 設定が壊れていないことに加えて、activate まで通ることを確認する。
      # sandbox は homeDirectory を /tmp/hm-sandbox に固定しているので
      # ランナーの実 HOME を汚さない。
      - name: sandbox へ activate して冪等性を確認
        if: matrix.os == 'ubuntu-latest'
        run: |
          nix build './nix#homeConfigurations.sandbox.activationPackage' -o /tmp/hm
          mkdir -p /tmp/hm-sandbox/.local/state/nix/profiles
          HOME=/tmp/hm-sandbox USER=user /tmp/hm/activate
          HOME=/tmp/hm-sandbox USER=user /tmp/hm/activate

      - name: warnings が空であることを確認
        if: matrix.os == 'ubuntu-latest'
        run: |
          warnings=$(nix eval --json \
            './nix#homeConfigurations.sandbox.config.warnings')
          echo "warnings: ${warnings}"
          test "${warnings}" = "[]"

  # flake.lock が「先端」へ飛んでいないことを確認する。
  #
  # flake.nix は nixpkgs-unstable を追ったままで、遅延は flake-lock-age.sh が
  # lock に書く pin でしか表現されていない。つまり素で `nix flake update` を
  # 叩くと遅延は黙って外れる。それに気付くための番人がこのジョブ。
  #
  # 判定に使う lastModified は commit 時刻なので、チャンネル公開時刻より
  # 1〜2 日古い側に出る (= 判定は少し緩い)。先端への事故を捕まえるには十分。
  lock-age:
    name: flake.lock の遅延ポリシー
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # script は flake.lock の JSON を nix に読ませる (jq に依存しない)。
      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: pin が下限日数を満たすか
        env:
          # workflow_dispatch 以外では空になり、script 側の既定 (7) が効く。
          DOTFILES_MIN_RELEASE_AGE_DAYS: ${{ inputs.min_release_age_days }}
        run: ./nix/scripts/flake-lock-age.sh check

  # devShell に入っている nixfmt / shfmt / shellcheck で整形と静的解析を確認する。
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: DeterminateSystems/nix-installer-action@ef8a148080ab6020fd15196c2084a2eea5ff2d25 # v22

      - name: nixfmt --check
        run: |
          nix develop ./nix --command bash -c '
            find nix -name "*.nix" -print0 | xargs -0 nixfmt --check
          '

      # nix/ 配下の *.sh をすべて見る。scripts/ だけでなく、Nix が配置する
      # files/bin/ files/claude/hooks/ files/claude/skills/*/scripts/ も
      # 実行されるものなので同じ静的解析にかける。nixfmt と同じく find で
      # 拾うので、置き場所が増えてもここを直さなくてよい。
      - name: shfmt / shellcheck
        run: |
          nix develop ./nix --command bash -c '
            mapfile -t files < <(find nix -type f -name "*.sh" | sort)
            printf "checking %s\n" "${files[@]}"
            shfmt -d "${files[@]}"
            shellcheck "${files[@]}"
          '
